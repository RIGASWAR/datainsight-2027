services:
  datainsight-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: datainsight-2027:latest
    container_name: datainsight-web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
