<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19C7E8"/>
      <stop offset="50%" stop-color="#176BFF"/>
      <stop offset="100%" stop-color="#071A3D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CE68"/>
      <stop offset="100%" stop-color="#E9B949"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon / Shield Frame -->
  <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" 
           stroke="url(#primaryGrad)" stroke-width="2.5" fill="#071A3D" fill-opacity="0.8" />
           
  <!-- Inner Circuit / Neural Connections -->
  <line x1="50" y1="6" x2="50" y2="35" stroke="#19C7E8" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="12" y1="27" x2="35" y2="45" stroke="#176BFF" stroke-width="1.5" />
  <line x1="88" y1="27" x2="65" y2="45" stroke="#176BFF" stroke-width="1.5" />
  <line x1="50" y1="65" x2="50" y2="94" stroke="#19C7E8" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="35" y1="55" x2="12" y2="73" stroke="#19C7E8" stroke-width="1.5" />
  <line x1="65" y1="55" x2="88" y2="73" stroke="#19C7E8" stroke-width="1.5" />

  <!-- Core Multimodal Diamond / Shield -->
  <polygon points="50,26 74,50 50,74 26,50" 
           fill="url(#primaryGrad)" stroke="#19C7E8" stroke-width="2" filter="url(#glow)" />

  <!-- Gold Neural Center Node -->
  <circle cx="50" cy="50" r="7" fill="url(#goldGrad)" />
  <circle cx="50" cy="50" r="12" stroke="#E9B949" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
  
  <!-- Outer Modality Nodes -->
  <circle cx="50" cy="6" r="3.5" fill="#19C7E8" />
  <circle cx="88" cy="27" r="3.5" fill="#176BFF" />
  <circle cx="88" cy="73" r="3.5" fill="#19C7E8" />
  <circle cx="50" cy="94" r="3.5" fill="#E9B949" />
  <circle cx="12" cy="73" r="3.5" fill="#176BFF" />
  <circle cx="12" cy="27" r="3.5" fill="#19C7E8" />
</svg>
